project_name: "NASA OCEANOS Puerto Rico"
data_root: "data"
raw_dir: "raw"
intermediate_dir: "intermediate"
products_dir: "products"
# Component paths resolve from data_root; this puts STAC at catalog/catalog.json.
catalog_dir: "../catalog"
default_crs: "EPSG:4326" # mide en grados (esfera)

# Approximate MVP example; replace this path to use a reviewed study boundary.
aoi:
  name: "La Parguera — MVP example"
  path: "configs/aoi/la_parguera_mvp.geojson"
  target_crs: "EPSG:32619" #mide en metros (plano) zona 19N

# Metadata discovery only; asset URLs are listed but never downloaded.
scenes:
  catalog_url: "https://earth-search.aws.element84.com/v1"
  collection: "sentinel-2-l2a"
  cloud_cover_max: null
  timeout: 30
  max_retries: 2
  page_size: 100

# Resolution and buffer in metres; categorical inputs always use nearest.
normalization:
  target_resolution: 10
  buffer_m: 0
  reference_band: "B02"
  continuous_resampling: "bilinear"
  warp_memory_limit_mb: 64
