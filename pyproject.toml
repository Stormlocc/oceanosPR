[project]
name = "oceanos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "affine>=2.4,<3",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyproj>=3.7.2",
    "pystac>=1.15.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
]

[project.scripts]
oceanospr = "oceanos.__main__:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.19.1",
    "pytest>=9.1.1",
    "ruff>=0.15.2",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "oceanos.acolite",
    "oceanos.acolite.*",
    "oceanos.domain",
    "oceanos.domain.*",
    "oceanos.index",
    "oceanos.index.*",
    "oceanos.pipeline",
    "oceanos.pipeline.*",
    "oceanos.storage",
    "oceanos.storage.*",
    "oceanos.timeseries",
    "oceanos.timeseries.*",
]
strict = true
